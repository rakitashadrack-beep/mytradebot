name: Verify MyTradeBot

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r backend/requirements.txt
      - run: python -m py_compile main.py core/*.py ui/*.py backend/*.py api/*.py
      - run: pytest -q tests tests_backend
