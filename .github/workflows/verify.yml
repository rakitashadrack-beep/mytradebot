
name: Verify MyTradeBot

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Run MyTradeBot Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libdbus-1-3

      - name: Verify Qt system libraries
        run: |
          ldconfig -p | grep -i libEGL
          test -e /usr/lib/x86_64-linux-gnu/libEGL.so.1

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install project dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r backend/requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile \
            main.py \
            core/*.py \
            ui/*.py \
            backend/*.py \
            api/*.py

      - name: Run automated tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q tests tests_backend

